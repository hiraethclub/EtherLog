name: Release

# Build standalone EtherLog executables for Windows, macOS and Linux and
# publish them to a GitHub Release whenever a version tag (e.g. v1.0.0-beta.1)
# is pushed. Tags containing a hyphen (pre-release identifiers such as -beta.1)
# are published as GitHub pre-releases.

on:
  push:
    tags:
      - "v*"
  # Manual trigger: builds the matrix and publishes a release, creating the
  # given tag at the current commit. Used when a tag cannot be pushed directly.
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to create and release (e.g. v1.0.0-beta.1)"
        required: true
        default: "v1.0.0-beta.1"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: etherlog-linux-x86_64
            binary: dist/etherlog
          - os: windows-latest
            asset_name: etherlog-windows-x86_64.exe
            binary: dist/etherlog.exe
          - os: macos-latest
            asset_name: etherlog-macos-arm64
            binary: dist/etherlog
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        run: pyinstaller etherlog.spec

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p out
          cp "${{ matrix.binary }}" "out/${{ matrix.asset_name }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: out/${{ matrix.asset_name }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TAG: ${{ github.event.inputs.tag }}
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$DISPATCH_TAG"
            # gh creates the tag at this commit when it does not yet exist.
            target_flag=(--target "$COMMIT_SHA")
          else
            tag="${GITHUB_REF_NAME}"
            target_flag=()
          fi
          # Any tag with a hyphen (e.g. -beta, -rc) is treated as a pre-release.
          prerelease_flag=()
          case "$tag" in
            *-*) prerelease_flag=(--prerelease) ;;
          esac
          gh release create "$tag" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "EtherLog $tag" \
            --notes "Automated build of EtherLog \`$tag\` for Windows, macOS and Linux. Download the executable for your platform below." \
            "${prerelease_flag[@]}" \
            "${target_flag[@]}" \
            artifacts/*
